<!doctype html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>تحديث مستندات المورّد — مجموعة الذيابي</title>
<style>
  :root{ --navy:#0B1B36; --gold:#C4A265; --ink:#1f2937; --muted:#6b7280;
         --line:#e6e9ef; --ok:#166534; --okbg:#ecfdf5; --bad:#b13434; --badbg:#fef2f2; }
  *{box-sizing:border-box}
  body{margin:0;background:#f4f6f9;color:var(--ink);
       font-family:'Segoe UI',Tahoma,Arial,sans-serif;line-height:1.7}
  .wrap{max-width:640px;margin:0 auto;padding:22px 14px 48px}
  .card{background:#fff;border-radius:16px;box-shadow:0 2px 14px rgba(11,27,54,.08);overflow:hidden}
  .head{background:var(--navy);color:#fff;padding:20px 22px}
  .head h1{margin:0;font-size:18px;font-weight:800}
  .head p{margin:4px 0 0;font-size:12.5px;color:var(--gold)}
  .body{padding:20px 22px}
  .co{font-size:15px;margin:0 0 4px}
  .co b{color:var(--navy)}
  .lead{font-size:13.5px;color:var(--muted);margin:0 0 18px}
  .doc{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
  .doc h2{margin:0 0 2px;font-size:15px;font-weight:700;color:var(--navy)}
  .cur{font-size:12.5px;color:var(--muted);margin:0 0 12px}
  .cur .exp{color:var(--bad);font-weight:700}
  .cur .soon{color:#8a6d1f;font-weight:700}
  label{display:block;font-size:12.5px;font-weight:600;margin:0 0 5px}
  input[type=date],input[type=file]{width:100%;border:1.5px solid var(--line);border-radius:9px;
       padding:9px 11px;font-size:13.5px;font-family:inherit;background:#fff;margin-bottom:11px}
  input[type=date]{direction:ltr;text-align:right}
  button{background:var(--navy);color:#fff;border:0;border-radius:10px;padding:11px 20px;
       font-size:13.5px;font-weight:700;font-family:inherit;cursor:pointer}
  button[disabled]{opacity:.5;cursor:not-allowed}
  .msg{margin-top:10px;font-size:13px;padding:9px 12px;border-radius:9px;display:none}
  .msg.ok{display:block;background:var(--okbg);color:var(--ok);border:1px solid #bbf7d0}
  .msg.err{display:block;background:var(--badbg);color:var(--bad);border:1px solid #fecaca}
  .done{background:var(--okbg);border-color:#bbf7d0}
  .foot{background:#f8fafc;padding:13px 22px;font-size:12px;color:var(--muted);text-align:center}
  .foot a{color:var(--navy)}
  .state{padding:34px 22px;text-align:center;color:var(--muted);font-size:14px}
  .hint{font-size:11.5px;color:var(--muted);margin:-6px 0 10px}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="head">
      <h1>مجموعة الذيابي — تحديث مستندات المورّد</h1>
      <p>إدارة المشتريات</p>
    </div>
    <div id="content" class="state">جارٍ التحقّق من الرابط…</div>
    <div class="foot">للاستفسار: <a href="mailto:supply@aldeyabi.com">supply@aldeyabi.com</a></div>
  </div>
</div>

<script>
/* صفحة عامّة بلا حساب: كل الصلاحية في الرمز الموقَّع بالرابط (يتحقّق منه الخادم).
   الفحص هنا تحسين تجربة فقط — الخادم هو المرجع (حارس الملفات الطبقي + تحقّق التاريخ). */
const TOKEN = new URLSearchParams(location.search).get('t') || '';
const MAX = 10 * 1024 * 1024;
const el = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function daysTo(d){
  if(!d) return null;
  const t = Date.parse(String(d).slice(0,10) + 'T00:00:00Z');
  if(!isFinite(t)) return null;
  return Math.round((t - Date.parse(new Date().toISOString().slice(0,10)+'T00:00:00Z'))/86400000);
}
function expiryNote(d){
  const n = daysTo(d);
  if(n == null) return '<span>لا يوجد تاريخ مسجَّل</span>';
  if(n < 0)  return `التاريخ المسجَّل: ${esc(d)} — <span class="exp">منتهية منذ ${Math.abs(n)} يوماً</span>`;
  if(n <= 30) return `التاريخ المسجَّل: ${esc(d)} — <span class="soon">تنتهي خلال ${n} يوماً</span>`;
  return `التاريخ المسجَّل: ${esc(d)}`;
}

/* توقيع سحريّ محليّ (PDF/JPEG/PNG) — نفس قائمة الخادم البيضاء */
async function sniff(file){
  const head = new Uint8Array(await file.slice(0, 8).arrayBuffer());
  const is = (...b) => b.every((v,i) => head[i] === v);
  if (is(0x25,0x50,0x44,0x46)) return 'pdf';                 // %PDF
  if (is(0xFF,0xD8,0xFF)) return 'jpg';
  if (is(0x89,0x50,0x4E,0x47,0x0D,0x0A,0x1A,0x0A)) return 'png';
  return null;
}

async function boot(){
  if(!TOKEN){ el('content').textContent = 'رابط غير مكتمل. افتح الرابط كما وصلك في البريد.'; return; }
  let data;
  try {
    const r = await fetch('/api/doc-renew?t=' + encodeURIComponent(TOKEN));
    data = await r.json();
    if(!r.ok || !data.ok) throw new Error(data && data.error || 'تعذّر التحقّق من الرابط');
  } catch(e){
    el('content').innerHTML = '<div class="msg err" style="display:block">' + esc(e.message) +
      '<br>يمكنك طلب رابط جديد بالردّ على بريد الطلب.</div>';
    return;
  }
  render(data);
}

function render(data){
  const today = new Date().toISOString().slice(0,10);
  const docs = data.docs.map((d,i) => `
    <div class="doc" id="doc-${i}">
      <h2>${esc(d.label)}</h2>
      <p class="cur">${d.has_expiry ? expiryNote(d.current_expiry) : 'مستند بلا تاريخ انتهاء'}</p>
      ${d.has_expiry ? `
        <label for="exp-${i}">تاريخ الانتهاء الجديد *</label>
        <input type="date" id="exp-${i}" min="${today}" lang="en-GB">` : ''}
      <label for="file-${i}">النسخة الجديدة (PDF أو صورة، حتى 10 ميغابايت) *</label>
      <input type="file" id="file-${i}" accept=".pdf,.jpg,.jpeg,.png,application/pdf,image/jpeg,image/png">
      <button id="btn-${i}" type="button">رفع واستبدال النسخة القديمة</button>
      <div class="msg" id="msg-${i}"></div>
    </div>`).join('');

  el('content').className = 'body';
  el('content').innerHTML =
    `<p class="co">السادة / <b>${esc(data.company)}</b> المحترمين،</p>
     <p class="lead">يُرجى رفع النسخة الجديدة لكل مستند أدناه مع تاريخ انتهائه الجديد.
        تحلّ النسخة الجديدة محلّ القديمة في ملفّكم لدينا فور الرفع.</p>
     ${docs}
     <p class="hint">لا تُطلب منكم إعادة التسجيل، ولا إرسال المستندات بالبريد أو الواتساب.</p>`;

  data.docs.forEach((d,i) => {
    el('btn-'+i).addEventListener('click', () => upload(d, i));
  });
}

const BUSY = new Set();   // منع الرفع المزدوج
async function upload(d, i){
  const btn = el('btn-'+i), msg = el('msg-'+i), fileEl = el('file-'+i);
  /* ⚠️ القفل **قبل أي await**: فحص التوقيع دالة غير متزامنة، فلولا هذا القفل
     ينزلق النقر المزدوج (شائع على الجوال) قبل تعطيل الزرّ ⇒ رفعان أو ثلاثة. */
  if(BUSY.has(i)) return;
  BUSY.add(i); btn.disabled = true;
  try { await doUpload(d, i, btn, msg, fileEl); }
  finally { BUSY.delete(i); }
}
async function doUpload(d, i, btn, msg, fileEl){
  const file = fileEl.files && fileEl.files[0];
  const show = (cls, text) => { msg.className = 'msg ' + cls; msg.textContent = text; };
  const release = () => { btn.disabled = false; };

  if(!file){ show('err','اختر الملف أولاً.'); release(); return; }
  if(file.size > MAX){ show('err','حجم الملف يتجاوز 10 ميغابايت.'); release(); return; }
  const kind = await sniff(file);
  if(!kind){ show('err','الصيغة غير مقبولة — يُقبل PDF أو صورة JPG/PNG فقط.'); release(); return; }

  let expiry = '';
  if(d.has_expiry){
    expiry = (el('exp-'+i).value || '').trim();
    if(!/^\d{4}-\d{2}-\d{2}$/.test(expiry)){ show('err','أدخل تاريخ الانتهاء الجديد.'); release(); return; }
    if(daysTo(expiry) < 0){ show('err','تاريخ الانتهاء يجب أن يكون مستقبليّاً.'); release(); return; }
  }

  show('', ''); msg.className = 'msg'; btn.textContent = 'جارٍ الرفع…';
  try{
    const qs = '?t=' + encodeURIComponent(TOKEN) + '&doc=' + encodeURIComponent(d.key) +
               (expiry ? '&expiry=' + encodeURIComponent(expiry) : '');
    const r = await fetch('/api/doc-renew' + qs, { method:'POST', body: file });
    const out = await r.json().catch(() => ({}));
    if(!r.ok || !out.ok) throw new Error(out.error || 'تعذّر الرفع');
    el('doc-'+i).classList.add('done');
    show('ok', 'تم استلام المستند وتحديث ملفّكم' + (expiry ? ` — تاريخ الانتهاء الجديد ${expiry}` : '') + '. شكراً لكم.');
    btn.textContent = 'تم الرفع ✓';
    fileEl.disabled = true;
    if(d.has_expiry) el('exp-'+i).disabled = true;
  }catch(e){
    show('err', e.message || 'تعذّر الرفع، حاول مرّة أخرى.');
    release(); btn.textContent = 'رفع واستبدال النسخة القديمة';
  }
}

boot();
</script>
</body>
</html>
