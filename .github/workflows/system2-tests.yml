name: system2-tests

# شبكة الأمان الآلية لنظام المشتريات الأساسي (index.html).
# كانت كل مسارات CI تخدم البوابة (النظام 3) والنظام الأساسي بلا أي تغطية،
# فكل انحدار يكتشفه المستخدم لا النظام. هذا المسار يمنع ذلك.

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'scripts/system2-tests.mjs'
      - 'functions/api/doc-renew.js'
      - 'renew-doc.html'
      - 'functions/api/notify.js'
      - 'functions/api/_pr-shared.js'
      - 'db/system2-staff-scope.sql'
      - 'db/system2-request-numbering.sql'
      - 'db/system2-request-flow.sql'
      - 'db/system2-request-tracking.sql'
      - 'functions/api/pr-doc.js'
      - 'db/system2-staff-invite.sql'
      - 'db/system2-scoped-least-privilege.sql'
      - 'db/system2-tests/**'
      - 'functions/api/staff-invite.js'
      - 'staff-register.html'
      - 'db/system2-tests/**'
      - '.github/workflows/system2-tests.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'scripts/system2-tests.mjs'
      - 'functions/api/doc-renew.js'
      - 'renew-doc.html'
      - 'functions/api/notify.js'
      - 'functions/api/_pr-shared.js'
      - 'db/system2-staff-scope.sql'
      - 'db/system2-request-numbering.sql'
      - 'db/system2-request-flow.sql'
      - 'db/system2-request-tracking.sql'
      - 'functions/api/pr-doc.js'
      - 'db/system2-staff-invite.sql'
      - 'db/system2-scoped-least-privilege.sql'
      - 'db/system2-tests/**'
      - 'functions/api/staff-invite.js'
      - 'staff-register.html'
      - 'db/system2-tests/**'
      - '.github/workflows/system2-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    name: تأكيدات النظام 2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # سلامة نحوية لكل كتلة سكربت داخل الصفحة — لا سكربت بناء في المشروع،
      # فهذه هي المرحلة التي تلتقط خطأ الصياغة قبل أن يصل للمستخدم.
      - name: فحص الصياغة (node --check)
        run: |
          node -e '
            const fs=require("fs"), os=require("os"), path=require("path"), {execFileSync}=require("child_process");
            const html=fs.readFileSync("index.html","utf8");
            const blocks=[...html.matchAll(/<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)<\/script>/g)].map(m=>m[1]);
            if(!blocks.length){ console.error("لم يُعثر على كتل سكربت"); process.exit(1); }
            blocks.forEach((b,i)=>{
              const f=path.join(os.tmpdir(),`block${i}.js`);
              fs.writeFileSync(f,b);
              execFileSync(process.execPath,["--check",f],{stdio:"inherit"});
            });
            console.log(`صياغة سليمة في ${blocks.length} كتلة سكربت`);
          '

      - name: حزمة تأكيدات النظام 2
        run: node scripts/system2-tests.mjs

  # حزمة نطاق موظفي الصيانة (RLS). ⚠️ بلا هذه الوظيفة تبقى **الحدود الأمنية
  # نفسها** بلا تغطية آلية: تعديلٌ يُسقِط `NOT proc_is_scoped()` من سياسة
  # يمرّ صامتاً، وتأكيدات الواجهة لا تراه لأنها لا تلمس القاعدة.
  scope-sql:
    runs-on: ubuntu-latest
    name: تأكيدات نطاق الصيانة (RLS)
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - name: حزمة النطاق (كعب Supabase + الهجرة + SC1–SC16 بـRLS فعليّة)
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
        run: bash db/system2-tests/run.sh
