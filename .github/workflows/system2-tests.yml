permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    name: تأكيدات النظام 2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # سلامة نحوية لكل كتلة سكربت داخل الصفحة — لا سكربت بناء في المشروع،
      # فهذه هي المرحلة التي تلتقط خطأ الصياغة قبل أن يصل للمستخدم.
      - name: فحص الصياغة (node --check)
        run: |
          node -e '
            const fs=require("fs"), os=require("os"), path=require("path"), {execFileSync}=require("child_process");
            const html=fs.readFileSync("index.html","utf8");
            const blocks=[...html.matchAll(/<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)<\/script>/g)].map(m=>m[1]);
            if(!blocks.length){ console.error("لم يُعثر على كتل سكربت"); process.exit(1); }
            blocks.forEach((b,i)=>{
              const f=path.join(os.tmpdir(),`block${i}.js`);
              fs.writeFileSync(f,b);
              execFileSync(process.execPath,["--check",f],{stdio:"inherit"});
            });
            console.log(`صياغة سليمة في ${blocks.length} كتلة سكربت`);
          '

      - name: حزمة تأكيدات النظام 2
        run: node scripts/system2-tests.mjs

      - name: عقد مساحة طلبات الشراء وحدود مستندات R2
        run: npm run test:purchase-workspace

  workspace-browser:
    runs-on: ubuntu-latest
    name: Purchase request workspace browser checks
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install pinned browser dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Validate desktop and mobile workspace
        run: npm run test:purchase-workspace-visual

      - name: Validate permissions and direct request links under production CSP
        shell: bash
        run: |
          node scripts/csp-preview-server.mjs > "$RUNNER_TEMP/pr-csp-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:8812/index.html > /dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat "$RUNNER_TEMP/pr-csp-server.log"
            exit 1
          fi
          node scripts/e2e/field-permissions.mjs
          node scripts/e2e/pr-attachments.mjs
          node scripts/e2e/pr-workspace-clarity.mjs
          node scripts/e2e/pr-request-flow-buckets.mjs
          node scripts/e2e/finance-email-followup.mjs
          node scripts/e2e/po-excel-paste-export.mjs
          node scripts/e2e/pr-print-one-page.mjs
          # ✅ `scoped-staff-screens.mjs` أُضيف هنا (2026-09-17) بعد **قياس** جذر
          # تقلّبه الذي بقي مجهولاً منذ 2026-09-15 (43/43 محليّاً · 31/43 ثمّ
          # 25/43 على العدّاء، بنمط «الهويّة والبيانات غائبتان»):
          # `bootstrap` يعمل على DOMContentLoaded وينادي `showLoginScreen()`
          # فيُخفي `#app-root`؛ وكان السكربت ينتظر **مدّة ثابتة** (1200ms) ثمّ
          # يبذر ويُظهِر الشاشة — فعلى عدّاءٍ بطيء يسبق البذرُ الإقلاعَ فينقضه
          # بعد لحظة، فتُقاس شجرةٌ ارتفاعها صفر. استُبدل الانتظار الثابت بالشرط
          # الحتميّ (ظهور بطاقة الدخول = انتهاء الإقلاع)، ومُتحقَّق: 3 تشغيلات
          # متتابعة + 4 متوازية تحت مزاحمة المعالج = 43/43 في السبع كلّها.
          node scripts/e2e/scoped-staff-screens.mjs

  # حزمة نطاق موظفي الصيانة (RLS). ⚠️ بلا هذه الوظيفة تبقى **الحدود الأمنية
  # نفسها** بلا تغطية آلية: تعديلٌ يُسقِط `NOT proc_is_scoped()` من سياسة
  # يمرّ صامتاً، وتأكيدات الواجهة لا تراه لأنها لا تلمس القاعدة.
  scope-sql:
    runs-on: ubuntu-latest
    name: تأكيدات نطاق الصيانة (RLS)
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - name: حزمة النطاق (كعب Supabase + الهجرة + SC1–SC16 بـRLS فعليّة)
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
        run: bash db/system2-tests/run.sh
