      - 'functions/api/notify.js'
      - 'functions/api/_pr-shared.js'
      - 'db/system2-staff-scope.sql'
      - 'db/system2-request-numbering.sql'
      - 'db/system2-request-flow.sql'
      - 'db/system2-request-tracking.sql'
      - 'db/system2-purchase-request-workspace.sql'
      - 'db/system2-request-closure.sql'
      - 'db/system2-approval-identity-and-history.sql'
      - 'db/system2-email-token-revision.sql'
      - 'db/system2-pr-attachments-unlock.sql'
      - 'db/system2-request-workspace-clarity.sql'
