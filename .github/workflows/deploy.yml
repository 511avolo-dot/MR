name: Deploy to Cloudflare Pages

# Production pushes are deployed by the Cloudflare Git integration. Keeping this
# workflow manual avoids a duplicate ad-hoc deployment overriding the clean Git
# deployment. The fallback uploads an immutable Git snapshot, never the workspace.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Publish clean snapshot to Cloudflare Pages
    steps:
      - uses: actions/checkout@v4

      - name: Prepare immutable deployment source
        shell: bash
        run: |
          source_dir="$RUNNER_TEMP/pages-source"
          mkdir -p "$source_dir"
          git archive --format=tar "$GITHUB_SHA" | tar -xf - -C "$source_dir"
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Deploy clean snapshot to Cloudflare Pages
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@3.90.0 pages deploy "$RUNNER_TEMP/pages-source" \
            --project-name=aldeyabi-procurement \
            --branch=main \
            --commit-hash="$GITHUB_SHA" \
            --commit-dirty=false
