name: portal-tests

# حزمة اختبار بوابة المشتريات (النظام 3): تحمّل المخطّط الكامل في PostgreSQL 16
# وتشغّل تأكيدات الصادر المعامَلاتي والتصليب الأمني على كل PR/دفع يمسّ البوابة.
on:
  pull_request:
    paths:
      - 'db/portal-standalone.sql'
      - 'db/portal-migrations/**'
      - 'db/portal-tests/**'
      - 'db/staging-bootstrap/**'
      - 'package.json'
      - 'package-lock.json'
      - 'functions/api/portal-*'
      - 'functions/api/_file-guard.js'
      - 'functions/api/reg-doc.js'
      - 'functions/_middleware.js'
      - 'assets/**'
      - 'purchase-portal.html'
      - '.github/workflows/portal-tests.yml'
      - 'scripts/**'
      - 'deploy/**'
      - 'supplier-quote.html'
      - '.github/workflows/pages.yml'
  push:
    branches: [main]
    paths:
      - 'db/portal-standalone.sql'
      - 'db/portal-migrations/**'
      - 'db/portal-tests/**'
      - 'db/staging-bootstrap/**'
      - 'package.json'
      - 'package-lock.json'
      - 'functions/api/portal-*'
      - 'functions/api/_file-guard.js'
      - 'functions/api/reg-doc.js'
      - 'functions/_middleware.js'
      - 'assets/**'
      - 'purchase-portal.html'
      - '.github/workflows/portal-tests.yml'
      - 'scripts/**'
      - 'deploy/**'
      - 'supplier-quote.html'
      - '.github/workflows/pages.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - name: تأكيدات حارس الملفات المرفوعة (JS)
        run: node db/portal-tests/file-guard.test.mjs

      - name: عقد الواجهة المؤسسية ومعاينة المستندات
        run: node scripts/e2e/enterprise-ui-contract.test.mjs

      - name: تحقّق قطعة الأساس staging (F1 drift guard)
        run: node scripts/deploy/build-baseline.mjs --check

      - name: اختبارات سلامة النشر (Stage 1 — env-guard/pages-exclude/portal-config/baseline)
        run: node scripts/stage1-tests.mjs

      - name: تحقّق عقد Supabase CLI (SKIP هنا — لا يُحتسب دليلاً؛ الوظيفة المخصّصة تفرضه)
        run: node scripts/deploy/verify-supabase-contract.mjs

      - name: تشغيل حزمة اختبار البوابة
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
        run: bash db/portal-tests/run.sh

      - name: F1 proof — قاعدة فارغة → أساس(061) → 062 → الحزمة (verify-baseline.sh)
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
        run: bash db/staging-bootstrap/verify-baseline.sh

  # (F2/F3) اختبار متصفّح حقيقيّ (Playwright/Chromium) بلا staging خارجيّ: عقد دخول النظام-3 +
  # حدّ سياق المتصفّح (HTTP/WebSocket/Service-Worker). staging الخارجيّ يبقى owner-gated (F5).
  browser-e2e-fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: تثبيت التبعيات (playwright مثبَّت الإصدار)
        run: npm ci
      - name: تثبيت متصفّح Chromium المطابق للإصدار
        run: npx playwright install --with-deps chromium
      - name: اختبار متصفّح fixture (F2/F3)
        run: node scripts/e2e/browser-fixture.test.mjs

  # (G1-R4-04) وظيفة مخصّصة: تُثبِّت Supabase CLI فعليّاً وتفرض عقد الأعلام (تفشل إن غاب/اختلف) —
  # فالتحقّق دليل بوّابة حقيقي لا «تخطّي». التنفيذ الحيّ للهجرة يبقى مؤجَّلاً على staging (G1-R4-06).
  supabase-contract:
    runs-on: ubuntu-latest
    env:
      # (G1-R5-01) إصدار مثبَّت بالضبط (لا 'latest'). قابل للتجاوز بمتغيّر مستودع، لكن لا يقع أبداً على متحرّك.
      SB_CLI: ${{ vars.SUPABASE_CLI_VERSION || '2.110.0' }}
    steps:
      - uses: actions/checkout@v4
      - name: تثبيت Supabase CLI (إصدار مثبَّت بالضبط = ${{ env.SB_CLI }})
        uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SB_CLI }}
      - name: فرض عقد الـCLI الحقيقي + تطابق الإصدار مع المثبَّت
        env:
          REQUIRE_SUPABASE_CLI: '1'
          SUPABASE_CLI_PIN: ${{ env.SB_CLI }}
        run: |
          echo "installed=$(supabase --version)  pin=${SB_CLI}"
          node scripts/deploy/verify-supabase-contract.mjs
