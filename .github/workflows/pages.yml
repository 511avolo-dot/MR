name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # (Stage 1, البند 5) سلامة GitHub Pages: صفحات النظام 3 (وكل صفحة تعتمد /api/*)
      # تُكسَر على GitHub Pages لعدم وجود Cloudflare Functions. نستبدلها بكعب إعادة توجيه
      # للنشر القانوني قبل الرفع، فلا تُنشَر صفحة مكسورة. المصدر: deploy/system3-manifest.json.
      - name: Exclude Function-dependent pages (System-3 safety)
        run: |
          node scripts/pages-exclude.mjs --check
          node scripts/pages-exclude.mjs --dir .

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
